name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Conversion tests (real FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install FFmpeg and PDF checkers
        run: sudo apt-get update && sudo apt-get install -y ffmpeg qpdf poppler-utils
      - name: Run tests
        run: dotnet run --project tests/Halora.Tests -c Release

  windows:
    name: Windows app
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file Halora.exe
        run: >
          dotnet publish src/Halora.App/Halora.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Halora.exe -DestinationPath Halora-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Halora-win-x64
          path: Halora-win-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Halora-win-x64.zip
