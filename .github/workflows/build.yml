name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Conversion tests (real FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install FFmpeg and PDF checkers
        run: sudo apt-get update && sudo apt-get install -y ffmpeg qpdf poppler-utils
      - name: Run tests
        run: dotnet run --project tests/Halora.Tests -c Release

  windows:
    name: Windows app
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pick version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = ([xml](Get-Content src/Halora.App/Halora.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      # Portable: one exe with .NET inside, nothing to install.
      - name: Publish portable Halora.exe
        run: >
          dotnet publish src/Halora.App/Halora.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Halora.exe -DestinationPath Halora-win-x64.zip

      # Installer: uses the shared .NET runtime, so it is ~4 MB instead of ~70 MB.
      - name: Publish Halora.exe for the installer
        run: >
          dotnet publish src/Halora.App/Halora.App.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o publish-setup
      - name: Get Inno Setup 6.7.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile innosetup.exe
          if ((Get-AuthenticodeSignature innosetup.exe).Status -ne "Valid") { throw "Inno Setup download isn't validly signed." }
          Start-Process innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\inno" -Wait
      - name: Build installer
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.value }}" installer/Halora.iss'

      # The same installer under a name that never changes, so the website can always link to the latest one.
      - name: Copy installer to a stable name
        shell: pwsh
        run: Copy-Item (Get-Item dist/Halora-Setup-*.exe).FullName Halora-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Halora-win-x64
          path: |
            Halora-win-x64.zip
            dist/Halora-Setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Halora-win-x64.zip
            Halora-Setup.exe
            dist/Halora-Setup-*.exe
